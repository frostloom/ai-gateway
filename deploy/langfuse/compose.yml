# Derived from official Langfuse Compose e3d264c38ec79e0c76746e92a3718be639002ce1. Local evaluation only.
name: ai-gateway-langfuse
services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: &id001
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      NEXTAUTH_URL: http://localhost:${LF_WEB_PORT:-13000}
      DATABASE_URL: postgresql://postgres:${LF_POSTGRES_PASSWORD:?Set LF_POSTGRES_PASSWORD}@postgres:5432/postgres
      SALT: ${LF_SALT:?Set LF_SALT}
      ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY:?Set LF_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?Set LF_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:?Set LF_MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:?Set LF_MINIO_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_MEDIA_UPLOAD_REQUEST_TIMEOUT_MS: 30000
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_AUTH: ${LF_REDIS_PASSWORD:?Set LF_REDIS_PASSWORD}
      REDIS_TLS_ENABLED: 'false'
      LANGFUSE_IN_APP_AGENT_ENABLED: 'false'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    depends_on: *id001
    environment:
      NEXTAUTH_URL: http://localhost:${LF_WEB_PORT:-13000}
      DATABASE_URL: postgresql://postgres:${LF_POSTGRES_PASSWORD:?Set LF_POSTGRES_PASSWORD}@postgres:5432/postgres
      SALT: ${LF_SALT:?Set LF_SALT}
      ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY:?Set LF_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?Set LF_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:?Set LF_MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:?Set LF_MINIO_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LF_MINIO_PORT:-19090}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_MEDIA_UPLOAD_REQUEST_TIMEOUT_MS: 30000
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_AUTH: ${LF_REDIS_PASSWORD:?Set LF_REDIS_PASSWORD}
      REDIS_TLS_ENABLED: 'false'
      LANGFUSE_IN_APP_AGENT_ENABLED: 'false'
      NEXTAUTH_SECRET: ${LF_NEXTAUTH_SECRET:?Set LF_NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
    - 127.0.0.1:${LF_WEB_PORT:-13000}:3000
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: 101:101
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?Set LF_CLICKHOUSE_PASSWORD}
    volumes:
    - ./data/clickhouse:/var/lib/clickhouse
    - ./data/clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit
        1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address
      ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LF_MINIO_PASSWORD:?Set LF_MINIO_PASSWORD}
    volumes:
    - ./data/minio:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
    - 127.0.0.1:${LF_MINIO_PORT:-19090}:9000
  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${LF_REDIS_PASSWORD:?Set LF_REDIS_PASSWORD}
    - --maxmemory-policy
    - noeviction
    - --appendonly
    - 'yes'
    volumes:
    - ./data/redis:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 3s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      REDIS_PASSWORD: ${LF_REDIS_PASSWORD:?Set LF_REDIS_PASSWORD}
  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LF_POSTGRES_PASSWORD:?Set LF_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
    - ./data/postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
