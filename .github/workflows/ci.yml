name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      AGENT_LIVE_JEV: "0"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6381:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1

  offline-evaluation:
    runs-on: windows-latest
    env:
      AGENT_LIVE_JEV: "0"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline contracts and local script doubles only
        run: python -m unittest discover -s scripts/tests
      - name: Preserve historical evidence
        run: |
          python scripts/customer-service-contract.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/archive-intent-contract.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/summarize-offline-intent-audit.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare-customer-fixtures.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/define-customer-tasks.py verify
          exit $LASTEXITCODE

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: verify
        run: npm ci && npm run verify
